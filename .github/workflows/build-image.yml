name: Build CI image

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/docker/**", ".github/workflows/build-image.yml"]
  push:
    branches: [main]
    paths: [".github/docker/**"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker
          push: true
          tags: |
            ghcr.io/iskaban10/bdm-ci:1
            ghcr.io/iskaban10/bdm-ci:latest