name: Build CI image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/docker/**"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bdm-ci:1
            ghcr.io/${{ github.repository_owner }}/bdm-ci:latest