name: CI

on:
  pull_request:
  push:
    branches: [main]   # or master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache \
            libopenmpi-dev openmpi-bin libomp-dev libgtest-dev

      - name: Fetch prebuilt BioDynaMo
        uses: compiler-research/ci-workflows/actions/setup-recipe@<sha-or-tag>
        with:
          recipe: biodynamo
          version: '<recipe-version>'
          os: ubuntu-24.04
          arch: x86_64

      - name: Configure
        run: |
          BDM_SH=$(find "$GITHUB_WORKSPACE" -path '*bin/thisbdm.sh' | head -n1)
          echo "Using $BDM_SH"
          source "$BDM_SH"
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: |
          source "$(find "$GITHUB_WORKSPACE" -path '*bin/thisbdm.sh' | head -n1)"
          cmake --build build -j"$(nproc)"