name: BioDyanMo build and run

on:
  pull_request:
    branches: [main]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y sudo curl wget git ca-certificates tzdata xvfb \
            bsdmainutils lsb-release gnupg

      - uses: actions/checkout@v4

      - name: Use CI config from the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git checkout FETCH_HEAD -- ci/params.json ci/bdm.toml
          cp ci/params.json ./params.json   # adjust destination to where your code reads it
          cp ci/bdm.toml    ./bdm.toml      # adjust destination

      - name: Install BioDynaMo
        shell: bash
        run: |
          curl -fsSL https://biodynamo.github.io/install \
            | env -i HOME="$HOME" PATH="$PATH" DEBIAN_FRONTEND=noninteractive bash

      - name: biodynamo build
        shell: bash
        run: |
          curl -fsSL https://biodynamo.github.io/install \
            | env -i HOME="$HOME" PATH="$PATH" DEBIAN_FRONTEND=noninteractive bash

      - name: biodynamo run
        shell: bash
        run: |
          source "$(ls -d $HOME/biodynamo-*/bin/thisbdm.sh | head -n 1)"
          xvfb-run -a biodynamo run