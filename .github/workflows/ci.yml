name: BioDynaMo build and run

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/<your-lowercase-owner>/bdm-ci:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch trusted CI config from base branch
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mkdir -p /tmp/ci-config
          for f in params.json bdm.toml; do
            git show "FETCH_HEAD:ci/$f" > "/tmp/ci-config/$f"
          done

      - name: Overwrite PR config with trusted CI config
        run: |
          cp /tmp/ci-config/params.json ./params.json   # adjust destination
          cp /tmp/ci-config/bdm.toml    ./bdm.toml      # adjust destination

      - name: biodynamo build
        shell: bash
        run: |
          source "$BDM_ENV"
          biodynamo build

      - name: biodynamo run
        shell: bash
        run: |
          source "$BDM_ENV"
          xvfb-run -a biodynamo run